# MCP permission-testing projects (created 2026-11-08 at Srinath's request).
# Two projects, three sample apps each, two replicas per app — used to test
# admin vs developer visibility/actions through the Paas Portal:
#   admin (cluster-admin) sees and can act in both projects;
#   developers have no binding here, so they see neither project
#   (their only project is `dev`, view-only).
# Image is the same httpd sample used for dev/sample — it is already
# present in the cluster's `openshift` imagestreams.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-testing-1
  labels:
    paas-portal/testing: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-testing-2
  labels:
    paas-portal/testing: "true"
# --- mcp-testing-1: app1, app2, app3 (2 replicas each) ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: mcp-testing-1
  labels:
    app: app1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: httpd
          image: image-registry.openshift-image-registry.svc:5000/openshift/httpd:2.4-ubi9
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: mcp-testing-1
  labels:
    app: app2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: httpd
          image: image-registry.openshift-image-registry.svc:5000/openshift/httpd:2.4-ubi9
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
