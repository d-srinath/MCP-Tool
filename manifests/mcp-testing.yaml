  name: view-testdeveloper1
  namespace: mcp-testing-1
subjects:
  - kind: User
    name: testdeveloper1
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
